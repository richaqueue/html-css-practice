<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Document</title>
       <style>
              * {
                     margin: 0;
                     padding: 0;
              }

              .logo {
                     margin-left: 20px;
                     display: flex;
                     align-self: center;
                     width: 30px;
                     height: 30px;
              }

              ul {
                     display: flex;
                     list-style: none;
                     gap: 20px;
                     padding: 30px;
              }

              /* li {
                     list-style: none;
                     display: inline;
                     align-items: center;
                     padding: 0 10px;
              } */

              header {
                     display: flex;
                     background-color: black;
                     color: white;
              }

              .container {
                     display: flex;
                     justify-content: space-between;
              }

              .left {
                     background-color: aqua;
                     height: 150px;
                     width: 100px;

              }

              .right {
                     background-color: aquamarine;
                     height: 150px;
                     width: 100px;

              }
       </style>
</head>

<body>
       <header>
              <img src="images.jfif" alt="logo" class="logo">

              <nav>
                     <ul>
                            <li>Home</li>
                            <li>About</li>
                            <li>Contact</li>
                     </ul>
              </nav>
       </header>
       <div class="container">
              <div class="left">hallllloooo!</div>
              <div class="right">byebyee</div>
       </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Animation</title>
       <style>
              * {
                     margin: 0;
                     padding: 0;
              }

              .container {
                     width: 100vw;
                     height: 100vh;
                     background-color: chartreuse;
              }

              .box {
                     /* width: 300px;
                     height: 300px; */
                     /* background-color:yellow ; */
                     /* color: black; */

                     /* display: flex; */
                     /* justify-content: center;
                     align-items: center; */

                     /* animation: Animate 3s ease-out 1s infinite normal; */
              }

              .box img {
                     width: 300px;
                     height: 300px ;
                     border: 5px dashed black;
                     animation: Animate 3s ease-out 1s infinite normal;
              }

              @keyframes Animate {
                     from {
                            width: 300px;
                            height: 300px;
                             border: 5px dashed black;
                     }

                     to {
                            width: 100vw;
                            height: 100vh;
                            border: 5px solid red;
                     }
              }
       </style>
</head>

<body>
       <div class="container">
              <div class="box">
                     <!-- meowmeow -->
                     <img src="draguunnn.jfif" alt="">
              </div>
       </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Document</title>
       <style>
              * {
                     margin: 0;
                     padding: 0;
              }

              .progress {
                     background-color: red;
                     height: 3px;
                     animation: load 1s ease-in 1;
              }

              header {
                     background-color: black;
                     color: white;
                     width: 100vw;
                     height: 80px;

              }

              li {
                     margin-top: 18px;
                     display: inline-block;
                     padding: 12px;
              }

              main {
                     background-color: pink;
                     width: 100vw;
                     height: 100vh;
              }

              @keyframes load {
                     0% {
                            width: 0;
                     }

                     50% {
                            width: 60vw;
                     }

                     100% {
                            width: 100vw;
                     }
              }

              main {
                     display: flex;
                     justify-content: center;
                     align-items: center;
              }

              img {
                     animation: rotate 2s ease-in infinite;
              }

              @keyframes rotate {
                     0% {
                            transform: rotate(0deg);
                     }

                     100% {
                            transform: rotate(360deg);
                     }
              }
       </style>
</head>

<body>
       <div class="progress"></div>
       <header>
              <nav>
                     <ul>
                            <li>Home</li>
                            <li>About</li>
                            <li>Contact</li>
                     </ul>
              </nav>
       </header>
       <main>
              <img src="draguunnn.jfif" alt="" width="500px" height="500px">
       </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Document</title>
       <style>
              * {
                     margin: 0;
                     padding: 0;
              }

              .logo {

                     margin: 20px;
                     width: 30px;
                     height: 30px;

              }

              ul {
                     display: flex;
                     list-style: none;


              }

              li {
                     display: inline;
                     padding: 20px;
              }

              header {
                     display: flex;

                     background-color: black;
                     color: white;
              }

              .background {
                     background-image: url(images.jfif);
                     height: 230px;
              }

              .images {
                     display: flex;
                     justify-content: space-evenly;
              }

              .I {
                     width: 180px;
                     height: 220px;
                     border: 2px solid red;

              }
       </style>
</head>

<body>
       <header>
              <img src="images.jfif" alt="logo" class="logo">

              <nav>
                     <ul>
                            <li>Home</li>
                            <li>About</li>
                            <li>Contact</li>
                     </ul>
              </nav>
       </header>
       <div class="background"></div>
       <div class="images">
              <div class="I"></div>
              <div class="I"></div>
              <div class="I"></div>
       </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Document</title>
       <style>
              .container {
                     display: flex;
                     flex-direction: row;
                     flex-wrap: wrap;
                     background-color: aquamarine;
                     height: 634px;
                     justify-content: center;
                     align-items: center;
                     /* align-content: center; */
              }

              .box1 {
                     height: 134px;
                     /* width: 256px; */
                     background-color: greenyellow;
                     border: 2px solid black;
                     order: 2;
                     /* align-self:flex-end; */
                     flex-grow:2;
              }

              .box2 {
                     height: 134px;
                     /* width: 256px; */
                     background-color: lime;
                     border: 2px solid black;
                     flex-grow:4;
              }
              .new{
                      height: 134px;
                     /* width: 256px; */
                     background-color: rgb(58, 107, 197);
                     border: 2px solid black;
                     order: 3;
                     /* align-self:flex-start; */
                     flex-grow:3;
              }
       </style>
</head>

<body>
       <div class="container">
              <div class="box1">box1</div>
              <div class="box2">box2</div>
              <div class="box2">box3</div>
              <div class="box2">box4</div>
              <div class="new">box5</div>
       </div>
</body>

</html>
